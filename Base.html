<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Lane Runner</title>
    <style>
        /* This handles the looks of the game */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #222;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            background: #333;
            border: 4px solid #555;
        }
        #ui {
            position: absolute;
            top: 20px;
            color: white;
            font-size: 24px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui">Score: 0</div>
<canvas id="gameCanvas"></canvas>

<!-- CRITICAL: This links to your other tab.
     Make sure your JS file is named exactly 'script.js' -->
<script src="script.js"></script>
</body>
</html>
